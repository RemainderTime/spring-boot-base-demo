server:
  port: 8089
  shutdown: graceful
spring:
  profiles:
    active: dev
  application:
    name: xf-boot-base
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PWD:nacos}
        file-extension: yml
        namespace: 34f368d5-a6c6-4f57-a80a-5402de295695
        group: DEFAULT_GROUP
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PWD:nacos}
        namespace: 34f368d5-a6c6-4f57-a80a-5402de295695
  config:
    import:
      - nacos:${spring.application.name}-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}

# Sa-Token Configuration
sa-token: 
  # token name (frontend needs to use this name, e.g., Authorization: Bearer xxxx, or just satoken: xxxx)
  token-name: Authorization
  # token validity period (seconds), -1 means never expire
  timeout: 2592000 
  # token temporary validity (seconds), -1 means never expire
  activity-timeout: -1 
  # allow concurrent login
  is-concurrent: true 
  # share token api
  is-share: true 
  # token style
  token-style: uuid
  # log
  is-log: false
  # read from cookie
  is-read-cookie: false
  # read from header
  is-read-header: true
  # read from body
  is-read-body: false

